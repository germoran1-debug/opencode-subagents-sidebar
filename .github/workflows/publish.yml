name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1; do not rely on whatever ships with the runner.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # No token and no build step: OIDC authenticates this workflow, and the
      # package ships as source. npm attaches provenance automatically.
      - name: Publish
        run: npm publish
